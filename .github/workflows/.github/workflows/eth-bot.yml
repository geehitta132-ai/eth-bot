name: ETH bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python eth_bot.py
        env:
          RUN_ONCE: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save data for dashboard
        run: |
          git config user.name "eth-bot"
          git config user.email "eth-bot@users.noreply.github.com"
          git add data.json
          git commit -m "update data" || exit 0
          git push
