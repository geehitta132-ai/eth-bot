<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ETH Bot</title>
<style>
:root{--bg:#fff;--card:#f3f4f6;--fg:#111;--mute:#6b7280;--g:#16a34a;--r:#dc2626;--n:#6b7280}
@media(prefers-color-scheme:dark){:root{--bg:#0b0d10;--card:#171a1f;--fg:#f3f4f6;--mute:#9ca3af}}
*{box-sizing:border-box}
body{margin:0;padding:max(16px,env(safe-area-inset-top)) 16px 24px;background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,sans-serif;max-width:480px;margin:auto}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.mute{color:var(--mute);font-size:13px}
.price{font-size:32px;font-weight:700}
.verdict{font-size:24px;font-weight:700;margin:4px 0 12px}
.bar{display:flex;gap:4px}.bar i{flex:1;height:10px;border-radius:5px;background:var(--mute);opacity:.25}
ul{padding-left:18px;margin:8px 0 0}li{margin:6px 0;font-size:15px}
svg{width:100%;height:90px}
</style>
</head>
<body>
<div class="card"><div class="mute">ETH / USD</div><div class="price" id="price">…</div>
<div class="verdict" id="verdict">Loading</div>
<div class="bar" id="bar"></div>
<div class="mute" id="upd" style="margin-top:10px"></div></div>
<div class="card"><b>Why</b><ul id="notes"></ul></div>
<div class="card"><b>Score, last 24h</b><svg id="chart" viewBox="0 0 300 90" preserveAspectRatio="none"></svg></div>
<script>
async function load(){
  try{
    const d=await (await fetch('data.json?'+Date.now())).json(), l=d.latest;
    const c=l.score>=2?'var(--g)':l.score<=-2?'var(--r)':'var(--n)';
    price.textContent='$'+l.price.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
    verdict.textContent=l.verdict; verdict.style.color=c;
    bar.innerHTML=''; for(let i=-6;i<=6;i++){ if(!i)continue; const e=document.createElement('i');
      if((l.score>0&&i>0&&i<=l.score)||(l.score<0&&i<0&&i>=l.score)){e.style.background=c;e.style.opacity=1}
      bar.appendChild(e)}
    upd.textContent='Score '+(l.score>0?'+':'')+l.score+' · updated '+new Date(d.updated).toLocaleString();
    notes.innerHTML=l.notes.map(n=>'<li>'+n+'</li>').join('');
    const h=d.history.map(x=>x.score), n=h.length;
    let p=h.map((s,i)=>(n>1?i/(n-1)*300:150)+','+(45-s*7)).join(' ');
    chart.innerHTML='<line x1="0" x2="300" y1="45" y2="45" stroke="currentColor" opacity=".2"/><polyline fill="none" stroke="'+c+'" stroke-width="2" points="'+p+'"/>';
  }catch(e){verdict.textContent='No data yet';upd.textContent='Run the GitHub workflow once, then refresh.'}
}
load(); setInterval(load,60000);
</script>
</body>
</html>
